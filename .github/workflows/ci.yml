name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the Android SDK; just add the platform we compile against.
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: ./gradlew --no-daemon :shared:jvmTest

      - name: Lint, unit tests and permission guard
        run: ./gradlew --no-daemon :androidApp:check

      - name: Build debug and release
        run: ./gradlew --no-daemon :androidApp:assembleDebug :androidApp:assembleRelease

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            shared/build/reports/
            androidApp/build/reports/
          if-no-files-found: ignore

      - name: Upload screen renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: androidApp/build/screenshots/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: snoresafe-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
